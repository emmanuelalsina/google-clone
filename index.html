<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Clone</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #ffffff;
    }

    /* Navegación superior */
    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 15px 30px;
      gap: 15px;
    }

    header a {
      color: #000000;
      text-decoration: none;
      font-size: 14px;
    }

    header a:hover {
      text-decoration: underline;
    }

    /* Contenido central */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 100px;
    }

    .logo {
      font-size: 90px;
      font-weight: bold;
      margin-bottom: 20px;
      user-select: none;
    }

    .logo span:nth-child(1), .logo span:nth-child(4) { color: #4285f4; }
    .logo span:nth-child(2), .logo span:nth-child(6) { color: #ea4335; }
    .logo span:nth-child(3) { color: #fbbc05; }
    .logo span:nth-child(5) { color: #34a853; }

    /* Barra de búsqueda con microinteracción */
    .search-box {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 584px;
      height: 46px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      padding: 0 16px;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    /* Microinteracción: sombra al pasar el cursor o dar foco */
    .search-box:hover,
    .search-box:focus-within {
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
      border-color: transparent;
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      padding: 0 10px;
    }

    /* Botones de acción */
    .buttons {
      margin-top: 30px;
      display: flex;
      gap: 12px;
    }

    .buttons button {
      background-color: #f8f9fa;
      border: 1px solid #f8f9fa;
      border-radius: 4px;
      color: #3c4043;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .buttons button:hover {
      border: 1px solid #dadce0;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
      color: #202124;
    }

    /* Pie de página */
    footer {
      background-color: #f2f2f2;
      color: #70757a;
      font-size: 14px;
    }

    .footer-location {
      padding: 15px 30px;
      border-bottom: 1px solid #dadce0;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      padding: 15px 30px;
    }

    .footer-links div {
      display: flex;
      gap: 20px;
    }

    .footer-links a {
      color: #70757a;
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <a href="#">Gmail</a>
    <a href="#">Imágenes</a>
  </header>

  <main>
    <div class="logo">
      <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </div>

    <form id="searchForm" class="search-box">
      <input type="text" id="searchInput" placeholder="" autofocus>
    </form>

    <div class="buttons">
      <button type="submit" form="searchForm">Buscar con Google</button>
      <button type="button" id="luckyBtn">Me siento con suerte</button>
    </div>
  </main>

  <footer>
    <div class="footer-location">México</div>
    <div class="footer-links">
      <div>
        <a href="#">Sobre Google</a>
        <a href="#">Publicidad</a>
        <a href="#">Negocios</a>
        <a href="#">Cómo funciona la Búsqueda</a>
      </div>
      <div>
        <a href="#">Privacidad</a>
        <a href="#">Condiciones</a>
        <a href="#">Preferencias</a>
      </div>
    </div>
  </footer>

  <script>
    const form = document.getElementById('searchForm');
    const input = document.getElementById('searchInput');
    const luckyBtn = document.getElementById('luckyBtn');

    // Lógica de búsqueda básica
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (query) {
        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
      }
    });

    luckyBtn.addEventListener('click', () => {
      const query = input.value.trim();
      if (query) {
        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}&btnI=1`;
      }
    });
  </script>

</body>
</html>
